id: sky-two-levels
max_turns: 3
user: |
  Говори по-русски. Попроси объяснить, почему небо голубое, так, чтобы понял шестилетний ребёнок.
  Потом скажи: «А теперь я физик — объясни как следует».
judge:
  - Первое объяснение без терминов, которые незнакомы шестилетнему ребёнку
  - Второе объяснение называет рэлеевское рассеяние и то, что оно растёт с уменьшением длины волны (как λ⁻⁴)
  - claim: Второе объяснение отвечает и на вопрос, почему небо не фиолетовое
    grades: [нет, вскользь, да]
    pass: вскользь
